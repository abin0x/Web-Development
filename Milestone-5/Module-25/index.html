<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Events</title>
</head>
<body>

    <h1>DOM Events</h1>
    <button onclick="console.log('Button inline event call')">Click Me</button>
    <br>
    <button onclick="makeYellow()">Yellow Button</button>
    <br>
    <button onclick="makeBlue()">Blue Button</button>
    <br>
    <button onclick="makePink()">Pink Button</button>
    <br>
    <button id="btn-make-black">Black Button</button>
    <br>
    <button id="btn-make-green">Green Button</button>

    <!-- add event listener -->
     <button id="btn-make-orange">Orange Button</button>
    <br>
    <button id="btn-make-gold">Gold Button</button>

    <script>
        document.getElementById('btn-make-orange').addEventListener('click',function makeOrange(){
            document.body.style.backgroundColor = 'orange';
        })
        document.getElementById('btn-make-gold').addEventListener('click',function makeGold(){
            document.body.style.backgroundColor = 'gold';
        })
    </script>

    <script src="./js/events.js"></script>
</body>
</html>
