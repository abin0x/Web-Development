<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Bus Tracker & Directions</h1>
        
        <div class="form-group">
            <label for="start">Start Location:</label>
            <input type="text" id="start" placeholder="Enter starting point">
        </div>
        <div class="form-group">
            <label for="end">Destination:</label>
            <input type="text" id="end" placeholder="Enter destination">
        </div>
        <div class="form-group">
            <label for="mode">Travel Mode:</label>
            <select id="mode">
                <option value="0">Driving</option>
                <option value="1">Cycling</option>
                <option value="2">Walking</option>
                <option value="3">Transit</option>
                <option value="4">Flight</option>
            </select>
        </div>
        <button id="getRoute">Get Route</button>

        <div id="output">
            <h2>Route Details</h2>
            <div id="directions"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
