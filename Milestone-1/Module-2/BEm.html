<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Block - Independent Entity */
.product-card {
  border: 1px solid #ddd;
  border-radius: 8px;
  overflow: hidden;
  max-width: 300px;
}

/* Element - Part of the block (__) */
.product-card__image {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.product-card__title {
  font-size: 1.25rem;
  padding: 10px;
}

/* Modifier - Special state or style (--) */
.product-card__button {
  width: 100%;
  padding: 15px;
  border: none;
  background: #333;
  color: white;
}
.product-card__button:hover {
  background: #573bf3;
}

.product-card__button--featured {
  background: #ff9800; /* স্পেশাল বাটনের জন্য আলাদা কালার */
  font-weight: bold;
}
    </style>
</head>
<body>
    <!-- Block: product-card -->
<div class="product-card">
  <!-- Element: product-card__image -->
  <img src="p1.jpg" alt="Product" class="product-card__image">
  
  <div class="product-card__content">
    <h2 class="product-card__title">Mechanical Keyboard</h2>
    <p class="product-card__price">$120</p>
    
    <!-- Element: product-card__button -->
    <button class="product-card__button">Add to Cart</button>

    <!-- Modifier: product-card__button--featured -->
    <button class="product-card__button product-card__button--featured">
      Buy Now
    </button>
  </div>
</div>
</body>
</html>
