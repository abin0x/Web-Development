<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 1. :is() - একাধিক সিলেক্টরকে গ্রুপ করা (High Specificity) */
.content-area :is(h1, h2, h3) {
  color: #db2121;
  text-transform: uppercase;
}

/* 2. :where() - :is() এর মতোই, কিন্তু Specificity সবসময় 0 */
/* এর ফলে অন্য যেকোনো কোড দিয়ে সহজেই এটি ওভাররাইট করা যায় */
:where(.card) h3 {
  margin-bottom: 20px;
}

/* 3. :has() - THE PARENT SELECTOR (The Game Changer) */
/* যদি .card এর ভেতরে <img> থাকে, তবে ওই .card এর বর্ডার নীল হবে */
.card:has(img) {
  border: 2px solid #007bff;
  background-color: #ce0d2d;
}

/* যদি .card এর ভেতরে শুধু <p> থাকে, তবে ফন্ট সাইজ ছোট হবে */
.card:has(p):not(:has(img)) {
  border: 1px dashed gray;
}
    </style>
</head>
<body>
    <section class="content-area">
  <div class="card">
    <h3>Title with Image</h3>
    <img src="thumb.jpg" alt="Thumb">
  </div>

  <div class="card">
    <h3>Title without Image</h3>
    <p>Only text here.</p>
  </div>
</section>
</body>
</html>
