<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles/selectors.css">
</head>
<body>
    <!-- HTML Structure -->
<div class="parent">
  <p>I am a direct child (Child 1)</p>
  <div class="wrapper">
    <p>I am a nested descendant (Descendant 1)</p>
  </div>
  <span>I am a span</span>
  <p>I am a sibling (Sibling 1)</p>
  <p>I am another sibling (Sibling 2)</p>
</div>
</body>
</html>
